[package]
name = "markdown-guest"
version = "0.18.2"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The building editor supplies the versioned interface; the guest never references host sources.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde_json = "1.0"
# CommonMark/GFM events retain source ranges; HTML5 tokenization handles embedded author markup.
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
html5ever = "=0.27.0"
